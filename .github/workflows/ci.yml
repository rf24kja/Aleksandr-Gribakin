name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A push once failed to produce a run at all, and the one before it sat
  # fifteen minutes without ever reaching a step and was cancelled. Neither was
  # the code's doing, but without this there was no way to ask for a verdict on
  # the current commit short of pushing something.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src/ api/ scripts/

      - name: Build
        run: npm run build

      # Downloading Chromium and WebKit on every run was what pushed the job
      # past its limit. The cache is keyed on the Playwright version, so a
      # dependency bump still fetches fresh binaries.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Chromium covers the desktop and the emulated touch phone; WebKit is
      # Safari, and therefore every iPhone — the terminal's on-screen-keyboard
      # handling was written for it.
      - name: Install browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # A cache hit restores the binaries but not the system libraries WebKit
      # links against, which are not in the cached path.
      - name: Install browser dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Test
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
