name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src/ api/ scripts/

      - name: Build
        run: npm run build

      # Chromium covers the desktop and the emulated touch phone; WebKit is
      # Safari, and therefore every iPhone — the terminal's on-screen-keyboard
      # handling was written for it.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
